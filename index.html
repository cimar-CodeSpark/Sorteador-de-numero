<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <title>Sorteador de Números</title>

</head>

<body>

    <main class="container-sorteador">
        <img id="logo" src="./assets/Logo 1.png" alt="Logo do Sorteador de Números" width="200">
        <h1 class="paragraph-main">Sortear um número entre:</h1>

        <div class="input-container">
            <label class="text-max" for="input-min">Mínimo:</label>
            <input type="number" min="0" max="99999"
                oninput="if(this.value.length > 5) this.value = this.value.slice(0, 5);" id="input-min" placeholder="0">

            <label class="text-min" for="input-max">Máximo:</label>
            <input type="number" min="0" max="99999"
                oninput="if(this.value.length > 5) this.value = this.value.slice(0, 5);" id="input-max"
                placeholder="99999">
        </div>
        <div id="container-count">
            <p class="title-count-draw">Quantidade de números que serão sorteados:</p>
            <input type="number" min="0" max="99"
                oninput="if(this.value.length > 2) this.value = this.value.slice(0, 2);" id="draw-count" value="1">
        </div>
        <button id="btn-sortear">Sortear</button>
        <div id="container-result">
            <p id="title-result"></p>
            <p id="result"></p>
        </div>

    </main>



    <footer>
        <h4>2026 - CiDev</h4>
    </footer>

</body>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="./script.js"></script>

</html>
